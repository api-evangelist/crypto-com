summary: Binds every command in Crypto.com's own published cdcx tool catalog (the surface the first-party
  @cryptocom/cdcx-cli MCP server exposes) to the backing operationId in the published Crypto.com Exchange
  REST OpenAPI, so each agent tool inherits a real inputSchema from the contract rather than a guessed
  one.
surfaces:
  openapi:
    file: openapi/crypto-com-exchange-openapi.yml
    operations: 95
    gated: false
  mcp:
    server: cdcx
    transport: stdio
    launch: npx -y @cryptocom/cdcx-cli@latest mcp
    tools_list_probed: '2026-08-11'
    gated: false
    note: tools/list answered anonymously and returned 9 tools for the default "market" service group;
      the other nine service groups (account, trade, advanced, margin, staking, funding, fiat, otc, stream)
      are opt-in via ~/.config/cdcx/mcp.toml and require API credentials, so their live inputSchemas were
      not observed. The published tool catalog covers all groups and is what is crosswalked here.
  graphql: null
