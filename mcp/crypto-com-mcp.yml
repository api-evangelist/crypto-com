status: published
source: https://www.npmjs.com/package/@cryptocom/cdcx-cli
server:
  name: cdcx
  version: 1.2.6
  protocol_version: '2025-06-18'
  transport: stdio
  launch: npx -y @cryptocom/cdcx-cli@latest mcp
  package: '@cryptocom/cdcx-cli'
  repository: https://github.com/crypto-com/cdcx-cli
  config: ~/.config/cdcx/mcp.toml
  config_schema: https://raw.githubusercontent.com/crypto-com/cdcx-cli/refs/heads/main/schemas/configs/mcp.json
  official: true
  note: 'First-party: published under the crypto-com GitHub organization and the @cryptocom npm scope.
    No hosted/remote HTTP MCP endpoint is published - the server runs locally over stdio and calls the
    Crypto.com Exchange REST API.'
service_groups:
  available:
  - market
  - account
  - trade
  - advanced
  - margin
  - staking
  - funding
  - fiat
  - otc
  - stream
  default:
  - market
  note: Only the market group is exposed by default; the rest are opted into in mcp.toml and require API
    credentials.
safety_model:
  tiers:
  - tier: read
    behavior: runs freely, no auth
  - tier: sensitive_read
    behavior: runs freely, auth required
  - tier: mutate
    behavior: requires acknowledged=true on the MCP call (--yes on the CLI)
  - tier: dangerous
    behavior: requires the server to be started with --allow-dangerous AND acknowledged=true
  allow_dangerous_default: false
  source: https://github.com/crypto-com/cdcx-cli/blob/main/agents/AGENTS.md
