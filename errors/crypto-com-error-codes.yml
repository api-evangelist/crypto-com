pay_codes:
  general:
  - code: api_key_invalid
    http_status: 401
    description: The provided API key is invalid or malformed.
  - code: invalid_parameter
    http_status: 400
    description: One or more parameters are invalid or missing.
  - code: resource_missing
    http_status: 404
    description: The requested resource with the provided ID does not exist.
  - code: secret_key_required
    http_status: 401
    description: This operation requires a secret key, but a publishable key was provided.
  payment:
  - code: account_not_enable
    http_status: 400
    description: The merchant account has not been activated yet.
  - code: amount_too_small
    http_status: 400
    description: The payment amount is below the minimum required amount.
  - code: annual_amount_limit
    http_status: 400
    description: The merchant has exceeded their annual payment amount limit.
  - code: customer_email_exist
    http_status: 400
    description: Email address cannot be changed for this payment.
  - code: customer_email_missing
    http_status: 400
    description: Customer email is required but was not provided.
  - code: daily_amount_limit
    http_status: 400
    description: The merchant has exceeded their daily payment amount limit.
  - code: invalid_amount
    http_status: 400
    description: The payment amount is invalid (e.g., less than or equal to 0).
  - code: invalid_tax_amount
    http_status: 400
    description: The tax amount is invalid (e.g., exceeds payment amount).
  - code: region_not_supported
    http_status: 400
    description: The customer's region is not supported for this payment.
  - code: sub_merchant_info_check
    http_status: 400
    description: Sub-merchant information is invalid or the sub-merchant is not enabled.
  - code: transaction_disabled
    http_status: 400
    description: The merchant account's transaction functionality has been disabled.
  redirect_url:
  - code: redirect_url_required
    http_status: 422
    description: return_url or cancel_url is missing and the merchant is not exempted from domain validation.
  - code: redirect_url_domain_not_allowed
    http_status: 422
    description: The domain in return_url or cancel_url is not in the merchant's approved whitelist, or the URL
      format is invalid.
  - code: redirect_url_scheme_not_allowed
    http_status: 422
    description: The URL scheme in return_url or cancel_url is not in the merchant's approved whitelist.
  refund:
  - code: account_not_match
    http_status: 403
    description: The provided payment ID does not belong to this merchant account.
  - code: not_enough_balance
    http_status: 400
    description: Insufficient balance to complete the refund.
websocket_termination_codes:
- code: 1000
  description: Normal disconnection by server, usually when the heartbeat is not handled properly
- code: 1006
  description: Abnormal disconnection
- code: 1013
  description: Server restarting - try again later
agent_error_taxonomy:
  source: https://github.com/crypto-com/cdcx-cli/blob/main/agents/error-catalog.json
  note: Crypto.com publishes a machine-readable, retryability-tagged mapping of Exchange codes into ten agent-facing
    categories, shipped inside its own CLI. This is the closest thing to remediation guidance the company publishes.
  categories:
  - category: auth
    retryable: false
    cdc_codes:
    - 10002
    - 10003
    - 10006
    - 10007
    - 40101
    - 40102
  - category: validation
    retryable: false
    cdc_codes:
    - 10001
    - 10004
    - 10005
    - 10008
    - 10009
  - category: safety
    retryable: false
    cdc_codes: []
  - category: rate_limit
    retryable: true
    cdc_codes:
    - 42901
  - category: insufficient_funds
    retryable: false
    cdc_codes:
    - 20001
    - 306
  - category: order_error
    retryable: false
    cdc_codes:
    - 20002
    - 20005
    - 20006
    - 20007
    - 318
  - category: network
    retryable: true
    cdc_codes: []
  - category: api
    retryable: false
    cdc_codes: []
  - category: config
    retryable: false
    cdc_codes: []
  - category: io
    retryable: true
    cdc_codes: []
  discrepancy: The CLI catalog references a 1000x/2000x code family (10001-10009, 20001-20007) that does not appear
    in the published REST reason-code tables, which use the 2xx/3xx/4xx/40xxx/5xxxx families. Recorded as found;
    not reconciled, because doing so would require guessing.
