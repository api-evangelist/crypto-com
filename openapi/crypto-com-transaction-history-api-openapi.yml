openapi: 3.2.0
info:
  title: Crypto.com Exchange API v1 Transaction History API
  version: 1.0.0
  description: '## Welcome


    Welcome to the Crypto.com Exchange API v1 reference documentation.'
servers:
- url: https://api.crypto.com/exchange/v1
  description: Production
- url: https://uat-api.3ona.co/exchange/v1
  description: UAT Sandbox
tags:
- name: Transaction History
  description: History will be stored for recent 6 months record only. For records over 6 months, please contact our support team.
paths:
  /private/get-order-detail:
    post:
      tags:
      - Transaction History
      x-apply-to:
      - rest
      summary: private/get-order-detail
      description: Gets detail of a single order by order_id or client_oid.
      operationId: privateGetOrderDetail
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateGetOrderDetail({\n  order_id: '19848525',\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_get_order_detail({\n    'order_id': '19848525',\n})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateGetOrderDetailRequest'
            example:
              id: '1'
              method: private/get-order-detail
              api_key: YOUR_API_KEY
              sig: DIGITAL_SIGNATURE
              params:
                order_id: '19848525'
              nonce: '1587846358253'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateGetOrderDetailResponse'
              example:
                id: '1'
                method: private/get-order-detail
                code: '0'
                result:
                  account_id: 52e7c00f-1324-5a6z-bfgt-de445bde21a5
                  order_id: '19848525'
                  client_oid: '1613571154900'
                  order_type: LIMIT
                  time_in_force: GOOD_TILL_CANCEL
                  side: BUY
                  exec_inst: []
                  quantity: '0.0100'
                  limit_price: '50000.0'
                  order_value: '500.000000'
                  maker_fee_rate: '0.000250'
                  taker_fee_rate: '0.000400'
                  avg_price: '0.0'
                  cumulative_quantity: '0.0000'
                  cumulative_value: '0.000000'
                  cumulative_fee: '0.000000'
                  status: ACTIVE
                  instrument_name: BTCUSD-PERP
                  fee_instrument_name: USD
                  reason: '43012'
                  create_time: '1613575617173'
                  create_time_ns: '1613575617173123456'
                  update_time: '1613575617173'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateGetOrderDetailResponse'
              example:
                id: '1'
                method: private/get-order-detail
                code: '40001'
                message: BAD_REQUEST
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateGetOrderDetailResponse'
              example:
                id: '1'
                method: private/get-order-detail
                code: '40101'
                message: UNAUTHORIZED
        '408':
          description: Request timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateGetOrderDetailResponse'
              example:
                id: '1'
                method: private/get-order-detail
                code: '40801'
                message: REQUEST_TIMEOUT
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
