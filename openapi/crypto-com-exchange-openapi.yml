x-additional-descriptions:
  - name: Prediction Reference Data
    slug: prediction-reference-data
    x-guide: prediction-reference-data
    tags:
      - Reference and Market Data
    location: insert
    method: guide
    description: |
      ## Prediction Reference Data

      Prediction market instruments contain rich metadata from `public/get-events` and `public/get-instruments` response. This metadata enables partners to build flexible navigation hierarchies tailored to their application's needs.

      ### Physical Instrument Hierarchy

      The physical data model consists of two levels:

      ```
      Event (underlying game/match/tournament)
        └─ Instrument (tradable contract)
      ```

      - Each **Event** groups related instruments under a common `event_symbol`. Event has metadata which allows you to extract League and Year information for higher level grouping, e.g. a Series.
      - Given an `event_symbol`, you can drill down for associated Instruments. Each **Instrument** represents a single tradable outcome with its own symbol and metadata.

      You can try [Prediction Instrument Hierarchy Explorer](/prediction-explorer) to visualise the instrument hierarchy.

      ### Event

      An **Event** represents a real-world occurrence that can have tradable outcomes — such as a sports match, tournament, election, or other predictable event. Events are returned by `public/get-events` and serve as the grouping level for related instruments.

      #### Sample Event Response

      ```json
      {
        "symbol": "FIFA-00001-260629-M",
        "series_symbols": [],
        "name": "Japan @ Brazil",
        "description": "Japan @ Brazil",
        "event_date": 1782766800000000000,
        "last_updated_time": 1782443710514350000,
        "event_details": {
          "metaData": {
            "NAME": "Japan @ Brazil",
            "EVENT_DATE": "2026-06-29T17:00:00-04:00",
            "SPORTS_GROUPING": "SOCCER"
          },
          "eventName": "Japan @ Brazil"
        }
      }
      ```

      #### Key Event Fields

      | Field | Description | Example |
      |-------|-------------|---------|
      | `symbol` | Unique event identifier. The prefix indicates the league (e.g., `FIFA`, `MLB`, `UFC`). Use this to query instruments via `public/get-instruments?event_symbol=...` | `"FIFA-00001-260629-M"` |
      | `event_details.metaData.SPORTS_GROUPING` | Sport category for grouping events. Specific to sports events. | `"SOCCER"`, `"MLB"`, `"ESPORT"`, `"MMA"` |
      | `event_details.metaData.NAME` | Human-readable event name, typically in "Away @ Home" format for matches | `"Japan @ Brazil"` |
      | `event_details.metaData.EVENT_DATE` | Event start time in ISO 8601 format. Extract the year component for season-based grouping. | `"2026-06-29T17:00:00-04:00"` |

      ### Instrument

      An **Instrument** represents a single tradable option contract tied to a specific outcome of an event. Instruments are returned by `public/get-instruments` and contain rich metadata for building navigation hierarchies and displaying contract details.

      #### Sample Instrument Response

      ```json
      {
        "id": -1,
        "method": "public/get-instruments",
        "code": 0,
        "result": {
          "data": [
            {
              "symbol": "NX.F.OPT.FIFA-00001-260714-M.O.1.67.20260830",
              "inst_type": "BINARY_OPTION",
              "display_name": "France vs Spain ; Spain (2-Way) ; AT&T Stadium ; 260714",
              "base_ccy": "USD",
              "quote_ccy": "USD",
              "tradable": true,
              "expiry_timestamp_ms": 1788127200000,
              "underlying_symbol": "FIFA-00001-260714-M",
              "event_details": {
                "metaData": {
                  "NAME": "Spain @ France",
                  "VENUE": "AT&T Stadium",
                  "LEAGUE": "FIFA",
                  "EVENT_DATE": "2026-07-14T19:00:00+00:00",
                  "PARTICIPANT": "Spain",
                  "SPORTS_GROUPING": "SOCCER",
                  "AWAY_PARTICIPANT": "Spain",
                  "HOME_PARTICIPANT": "France",
                  "PREDICT_CATEGORY": "Sports",
                  "PREDICT_EVENT_TYPE": "Game",
                  "PREDICT_MARKET_TYPE": "Game Line",
                  "PREDICT_PERIOD_TYPE": "90 Minutes and Stoppage Time",
                  "PREDICT_OUTCOME_TYPE": "Away",
                  "PREDICT_CONTRACT_TYPE": "Moneyline (2-Way)"
                },
                "eventName": "Spain to win"
              }
            },
            {
              "symbol": "NX.F.OPT.FIFA-00001-260714-M.O.1.68.20260830",
              "inst_type": "BINARY_OPTION",
              "display_name": "France vs Spain ; France (2-Way) ; AT&T Stadium ; 260714",
              "base_ccy": "USD",
              "quote_ccy": "USD",
              "tradable": true,
              "expiry_timestamp_ms": 1788127200000,
              "underlying_symbol": "FIFA-00001-260714-M",
              "event_details": {
                "metaData": {
                  "NAME": "Spain @ France",
                  "VENUE": "AT&T Stadium",
                  "LEAGUE": "FIFA",
                  "EVENT_DATE": "2026-07-14T19:00:00+00:00",
                  "PARTICIPANT": "France",
                  "SPORTS_GROUPING": "SOCCER",
                  "AWAY_PARTICIPANT": "Spain",
                  "HOME_PARTICIPANT": "France",
                  "PREDICT_CATEGORY": "Sports",
                  "PREDICT_EVENT_TYPE": "Game",
                  "PREDICT_MARKET_TYPE": "Game Line",
                  "PREDICT_PERIOD_TYPE": "90 Minutes and Stoppage Time",
                  "PREDICT_OUTCOME_TYPE": "Home",
                  "PREDICT_CONTRACT_TYPE": "Moneyline (2-Way)"
                },
                "eventName": "France to win"
              }
            }
          ]
        }
      }
      ```

      #### Key Instrument Fields

      Use these metadata fields to build navigation hierarchies:

      | Field | Description | Example |
      |-------|-------------|---------|
      | `event_details.metaData.PREDICT_CATEGORY` | Top-level category for all prediction markets | `"Sports"`, `"Politics"`, `"Culture"` |
      | `event_details.metaData.SPORTS_GROUPING` | Sport category (for sports events) | `"SOCCER"`, `"MLB"`, `"ESPORT"`, `"MMA"` |
      | `event_details.metaData.LEAGUE` | Specific league within the sport | `"FIFA"`, `"EPL"`, `"UCL"`, `"MLS"` |
      | `event_details.metaData.EVENT_DATE` | Event start time (ISO 8601). Extract year for season grouping. | `"2026-07-14T19:00:00+00:00"` |
      | `event_details.metaData.NAME` | Human-readable event name in "Away @ Home" format | `"Spain @ France"` |
      | `event_details.metaData.PREDICT_CONTRACT_TYPE` | Type of contract/market | `"Moneyline (2-Way)"`, `"Spread"`, `"Total Goals"` |
      | `event_details.metaData.PREDICT_PERIOD_TYPE` | Time period the contract covers | `"90 Minutes and Stoppage Time"`, `"Full Game"`, `"1st Half"` |

      #### Example Hierarchy

      Using the fields above, you can, for example, build a three-level navigation hierarchy:

      | Level | Fields | Example |
      |-------|--------|---------|
      | **Series** | `PREDICT_CATEGORY` → `SPORTS_GROUPING` → `LEAGUE` → `YEAR(EVENT_DATE)` | Sports > SOCCER > FIFA > 2026 |
      | **Event** | `NAME` → `PREDICT_CONTRACT_TYPE` → `PREDICT_PERIOD_TYPE` | Spain @ France > Moneyline (2-Way) > 90 Minutes and Stoppage Time |
      | **Contract** | The instrument record itself | `NX.F.OPT.FIFA-00001-260714-M.O.1.67.20260830` |

      ### Getting Continuous Updates

      Both `public/get-events` and `public/get-instruments` support pagination and incremental updates using `since` and `cursor` parameters.

      #### Initial Load

      ```
      GET /dcm/v1/public/get-events?since=0
      GET /dcm/v1/public/get-instruments?since=0
      ```

      Use `since=0` to fetch all available records from the beginning.

      #### Pagination

      When results exceed the page limit, the response includes a `next_cursor` field. Use it to fetch the next page:

      ```
      GET /dcm/v1/public/get-events?since=0&cursor={next_cursor}
      GET /dcm/v1/public/get-instruments?since=0&cursor={next_cursor}
      ```

      Continue paginating until no `next_cursor` is returned.

      #### Incremental Updates

      After the initial load, use the `last_updated_time` from the most recent record as your `since` value to fetch only new or updated records:

      ```
      GET /dcm/v1/public/get-events?since={last_updated_time}
      GET /dcm/v1/public/get-instruments?since={last_updated_time}
      ```

      This enables efficient polling for changes without re-fetching the entire dataset.

      ### Example: Continuously Building a 3-Level Instrument Hierarchy

      This example demonstrates how to build and maintain a **Series > Event > Contract** hierarchy using REST polling with `since` and `cursor` parameters.

      **Goal:**
      - Build a 3-level navigation hierarchy: Series → Event → Contract
      - Keep data up-to-date via continuous REST polling

      **Procedure:**

      1. **Initialize tracking variables:**
         ```
         events_last_modified = 0
         instruments_last_modified = 0
         ```

      2. **Fetch events with changes:**
         ```
         GET /dcm/v1/public/get-events?since={events_last_modified}
         ```
         Paginate using `cursor` until all pages are retrieved.

      3. **For each event, fetch associated instruments:**
         ```
         GET /dcm/v1/public/get-instruments?event_symbol={symbol}&since={instruments_last_modified}
         ```
         This can be done in parallel for multiple events. Paginate each using `cursor`.

      4. **Build the hierarchy from instrument metadata:**
         - **Series level:** Group by `PREDICT_CATEGORY` → `SPORTS_GROUPING` → `LEAGUE` → `YEAR(EVENT_DATE)`
         - **Event level:** Group by `NAME` → `PREDICT_CONTRACT_TYPE` → `PREDICT_PERIOD_TYPE`
         - **Contract level:** Individual instrument records

      5. **Update tracking variables:**
         Record the maximum `last_updated_time` from events and instruments for the next polling cycle.

      6. **Sleep and repeat:**
         Wait for your desired polling interval, then return to step 2 with the updated `since` values.

      This approach ensures you only fetch changed records on subsequent cycles, minimizing API calls and data transfer.

      ### Full Meta Data Reference

      For the complete metadata specification, please refer to [FIX Document Pack > Prediction Market Appendix](/docs/api/fix/fix-introduction) for details.
  - name: Instrument Status Updates
    slug: instrument-status-updates
    x-guide: instrument-status-updates
    tags:
      - Reference and Market Data
    location: insert
    method: guide
    description: |
      ## Instrument Status Updates

      Two additional endpoints provide real-time visibility into instrument state changes:

      | Endpoint | Description |
      |----------|-------------|
      | [`public/get-instrument-lifecycle-states`](/docs/api/rest/public-get-instrument-lifecycle-states) | Track lifecycle state transitions (e.g., `Suspended` → `Closed`) |
      | [`public/get-instrument-market-status`](/docs/api/rest/public-get-instrument-market-status) | Track market trading status changes (e.g., `OPEN` → `CLOSED`) |

      Both endpoints support the same pagination pattern (`since`, `cursor`, `limit`) and can be filtered by `event_symbol` for efficient parallel loading.

      ### Lifecycle States vs Market Status

      - **Lifecycle states** represent the instrument's position in its overall lifecycle (e.g., Active, Suspended, Closed). Use this to determine if an instrument can potentially be traded or has reached end-of-life.
      - **Market status** indicates whether the instrument is currently open for trading. An instrument may be in an Active lifecycle state but have a Closed market status.

      ### Parallel Loading by Event

      For efficient data loading, fetch status updates per event in parallel:

      ```
      # For each event, fetch lifecycle and market status in parallel
      GET /dcm/v1/public/get-instrument-lifecycle-states?event_symbol={event_symbol}&since={last_updated_time}
      GET /dcm/v1/public/get-instrument-market-status?event_symbol={event_symbol}&since={last_updated_time}
      ```

      Since instruments within the same event typically change state around the same time (e.g., when a game ends), filtering by `event_symbol` enables effective parallelism across events.
  - name: Settlement Rules and Languages
    slug: settlement-rules-laguages
    x-guide: settlement-rules-laguages
    tags:
      - Reference and Market Data
    location: insert
    method: guide
    description: |
      ## Settlement Rules and Languages

      Settlement rules and languages define how prediction markets resolve. This data is available via Excel file from the support team.

      ### Excel Schema

      The settlement data file contains the following columns:

      | Column | Description |
      |--------|-------------|
      | **Market Title** | Human-readable name of the prediction market |
      | **Date Added** | Date the market was added to the platform |
      | **Tradeable Symbol** | Instrument symbol (e.g., `NX.F.OPT.ELECT-CALGOV.O.1.x`) |
      | **Market Close (ET)** | Market closing time in Eastern Time |
      | **Projected Payout** | Expected payout timing (e.g., "30 minutes after closing") |
      | **Settlement Language** | Full settlement terms including resolution criteria and source agencies |
      | **Rule Number** | CDNA Rulebook rule reference (e.g., 14.62, 14.64, 14.68) |
      | **Rule** | Rule name (e.g., "ELECTION OUTCOME EVENT CENTI CONTRACT") |
      | **Rule Source** | Source agencies for resolution (e.g., AP, Reuters, major news networks) |
      | **Trading Prohibitions** | Restrictions on who may trade (e.g., source agency employees) |
      | **Status** | Market status (Active, Inactive, etc.) |

      ### How to Obtain

      Contact the support team to request the latest settlement rules and languages file. Updates are provided when markets are added or settlement terms change.

      ### Settlement Rules API

      The REST API provides programmatic access to settlement rules and languages.

      #### Available Endpoints

      | Method | Description | API Reference |
      |--------|-------------|---------------|
      | [`public/settlement-rules`](/docs/api/rest/public-get-settlement-rules) | Returns all settlement rules with their source agencies and trading prohibitions | [View &rarr;](/docs/api/rest/public-get-settlement-rules) |
      | [`public/payout-projections`](/docs/api/rest/public-get-payout-projections) | Returns all payout projection timing descriptions | [View &rarr;](/docs/api/rest/public-get-payout-projections) |
      | [`public/event-settlement-description/events/{event_symbol}`](/docs/api/rest/public-get-event-settlement-description-by-event) | Returns realized settlement descriptions for all instruments under a specific event | [View &rarr;](/docs/api/rest/public-get-event-settlement-description-by-event) |

      ### Loading Settlement Data

      Settlement rules and payout projections are reference data that change infrequently. Load them once at startup and refresh periodically.

      #### Initial Load

      Fetch all reference data in parallel:

      ```
      GET /dcm/v1/public/settlement-rules
      GET /dcm/v1/public/payout-projections
      ```

      Build lookup maps keyed by `settlement_rule_code` and `payout_projection_code` for efficient access when processing event settlement descriptions.

      #### Loading Settlement Descriptions

      Settlement descriptions are loaded per event. For each event from `public/get-events`, fetch the settlement descriptions:

      ```
      GET /dcm/v1/public/event-settlement-description/events/FIFA-00001-260714-M
      ```

      You can fetch multiple events in parallel. The response includes the realized `settlement_description` text for each instrument, along with the underlying `settlement_definition` template. Use the `settlement_rule_code` and `payout_projection_code` to join with your reference data lookup maps.
  - name: Prediction Market Data
    slug: prediction-market-data
    x-guide: prediction-market-data
    tags:
      - Reference and Market Data
    location: insert
    method: guide
    description: |
      ## Prediction Market Data

      Prediction market data is available through two channels:

      ### FIX Trading and Market Data

      **Best for:** Trading applications

      Ultra Low Latency market data with minimal latency, designed for trading applications.

      - Order book snapshots and incremental updates
      - Trade execution reports
      - Instrument reference data

      You can flexibility build analytics logic based on the real time raw market data: probability calculation, spread computation, etc. Most B2B trading partners use this approach.

      [View FIX Trading and Market Data API Documentation &rarr;](/docs/api/fix/fix-introduction)

      ### Non Trading Prediction Market Data

      **Best for:** Marketing & content sites

      Pre-computed, enriched market data for marketing sites, news portals, and content platforms.

      - Pre-calculated probability and spread values
      - Events as first-class entities with market groupings
      - Full-text search across markets and events
      - Rich metadata (descriptions, categories, resolution criteria)

      Intended for display and content purposes only, may not be optimised for trading.

      [View Non Trading Prediction Market Data API Documentation &rarr;](https://data.crypto.com/)
