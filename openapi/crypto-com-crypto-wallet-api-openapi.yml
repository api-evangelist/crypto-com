openapi: 3.2.0
info:
  title: Crypto.com Exchange API v1 Crypto Wallet API
  version: 1.0.0
  description: '## Welcome


    Welcome to the Crypto.com Exchange API v1 reference documentation.'
servers:
- url: https://api.crypto.com/exchange/v1
  description: Production
- url: https://uat-api.3ona.co/exchange/v1
  description: UAT Sandbox
tags:
- name: Crypto Wallet
  description: 'Manages the user''s wallet.


    Most of the endpoints are only available at master account level.


    Some endpoints requires Withdrawal setting to be enabled for your API Key. If you do not see the option when viewing your API Keys, this feature is not yet available for you.'
paths:
  /private/create-withdrawal:
    post:
      tags:
      - Crypto Wallet
      x-apply-to:
      - rest
      summary: private/create-withdrawal
      description: Creates a withdrawal request. Withdrawal setting must be enabled for your API Key. If you do not see the option when viewing your API Key, this feature is not yet available for you.
      operationId: privateCreateWithdrawal
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateCreateWithdrawal({\n  client_wid: 'my_withdrawal_002',\n  currency: 'BTC',\n  amount: '1',\n  address: '2NBqqD5GRJ8wHy1PYyCXTe9ke5226FhavBf',\n  address_tag: '',\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_create_withdrawal({\n    'client_wid': 'my_withdrawal_002',\n    'currency': 'BTC',\n    'amount': '1',\n    'address': '2NBqqD5GRJ8wHy1PYyCXTe9ke5226FhavBf',\n    'address_tag': '',\n})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateCreateWithdrawalRequest'
            example:
              id: '-1'
              method: private/create-withdrawal
              api_key: YOUR_API_KEY
              sig: DIGITAL_SIGNATURE
              nonce: '1607063412000'
              params:
                client_wid: my_withdrawal_002
                currency: BTC
                amount: '1'
                address: 2NBqqD5GRJ8wHy1PYyCXTe9ke5226FhavBf
                address_tag: ''
                network_id: null
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateWithdrawalResponse'
              example:
                id: '-1'
                method: private/create-withdrawal
                code: '0'
                result:
                  id: '2220'
                  amount: '1'
                  fee: '0.0004'
                  symbol: BTC
                  address: 2NBqqD5GRJ8wHy1PYyCXTe9ke5226FhavBf
                  client_wid: my_withdrawal_002
                  create_time: '1607063412000'
                  network_id: null
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateWithdrawalResponse'
              example:
                id: '1'
                method: private/create-withdrawal
                code: '40001'
                message: BAD_REQUEST
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateWithdrawalResponse'
              example:
                id: '1'
                method: private/create-withdrawal
                code: '40101'
                message: UNAUTHORIZED
        '408':
          description: Request timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateWithdrawalResponse'
              example:
                id: '1'
                method: private/create-withdrawal
                code: '40801'
                message: REQUEST_TIMEOUT
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateWithdrawalResponse'
              example:
                id: '1'
                method: private/create-withdrawal
                code: '42901'
                message: TOO_MANY_REQUESTS
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateWithdrawalResponse'
              example:
                id: '1'
                method: private/create-withdrawal
                code: '50001'
                message: INTERNAL_SERVER_ERROR
