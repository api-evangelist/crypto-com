    x-discriminators:
      DCA:
        tags:
          - Trading Bot API
        summary: private/bot/create-trading-bot (DCA)
        description: |
          Creates a new DCA (Dollar-Cost Averaging) Trading Bot that automatically buys or sells at regular intervals over a preset time frame.

          DCA trading is used by investors who would like to reduce the influence of volatility and accumulate or decumulate positions gradually.
      TWAP:
        tags:
          - Trading Bot API
        summary: private/bot/create-trading-bot (TWAP)
        description: |
          Creates a new TWAP (Time-Weighted Average Price) Trading Bot that executes large orders by splitting them into smaller slices over a defined time window to minimise market impact.
      GRID:
        tags:
          - Trading Bot API
        summary: private/bot/create-trading-bot (GRID)
        description: |
          Creates a new GRID Trading Bot that automatically places buy and sell orders within a defined price range.
      FUNDING_ARBITRAGE:
        tags:
          - Trading Bot API
        summary: private/bot/create-trading-bot (FUNDING_ARBITRAGE)
        description: |
          Creates a new Funding Arbitrage Trading Bot that simultaneously holds a spot position and an opposing perpetual swap position to capture funding rate income.
