format: proprietary
problem_json: false
note: Crypto.com does not use RFC 9457 application/problem+json on any surface. The Exchange returns a numeric reason
  `code` inside a 200-shaped envelope alongside the HTTP status, and materially, some failures arrive as HTTP 200
  with a non-zero code. Crypto.com Pay uses a separate string-code envelope. All three tables below are transcribed
  from the provider docs.
envelopes:
- api: Crypto.com Exchange REST + WebSocket API v1
  shape:
    id: long
    method: string
    code: int (0 = success)
    message: string
    original: escaped original request, error cases only
  note: On a websocket error where the original request omitted id/method, id is -1 and method is ERROR.
- api: Crypto.com Pay API
  shape:
    error:
      type: authentication_error | invalid_request_error | forbidden_error | not_found_error | rate_limit_error
      error_code: string
      param: string, when parameter-specific
      error_message: string
exchange_http_semantics:
- status: 200
  meaning: Success (code 0), plus two non-fatal outcomes carried as codes 40401 and 43012
- status: 400
  meaning: Bad request / rejected order
- status: 401
  meaning: Unauthorized - bad key, bad signature, non-whitelisted IP, or wrong user tier
- status: 408
  meaning: Request timeout
- status: 429
  meaning: Rate limit exceeded (code 42901)
- status: 500
  meaning: Internal error and the bulk of risk/margin/position rejections
