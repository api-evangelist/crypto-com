  /private/get-accounts:
    post:
      tags:
      - Account Balance and Positions
      x-apply-to:
      - rest
      summary: private/get-accounts
      description: Get Account and its Sub Accounts.
      operationId: privateGetAccounts
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateGetAccounts({\n  page_size: \"30\",\n  page: \"2\",\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_get_accounts({\n    'page_size': \"30\",\n    'page': \"2\",\n})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
