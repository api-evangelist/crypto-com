              params: {}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateFiatFiatAccessResponse'
              example:
                id: '3'
                method: private/fiat/fiat-access
                code: '0'
                result:
                  accesses:
