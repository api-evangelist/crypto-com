response_headers:
  published: false
  headers: []
  note: 'No rate-limit response headers are documented on any Crypto.com surface - no X-RateLimit-*, no RateLimit-*
    (RFC 9331 draft), no Retry-After. Exhaustion is signalled only by HTTP 429 with in-body code 42901 TOO_MANY_REQUESTS.
    This is the single biggest runtime-semantics gap for an agent: the numbers are published, the live signal is
    not.'
