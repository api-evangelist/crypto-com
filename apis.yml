aid: crypto-com
name: Crypto.com
description: 'Crypto.com is a cryptocurrency exchange, brokerage and payments company serving retail and
  institutional customers across spot, margin and derivatives trading, staking, custody, card and payment
  acceptance, and on-chain development on the Cronos EVM and Cronos zkEVM networks. Its public developer
  surface spans four programmable products: the Crypto.com Exchange API v1 (REST, WebSocket and FIX 4.4)
  for market data, order entry, advanced OCO/OTO/OTOCO orders, trading bots, portfolio, wallet and staking
  operations; the Crypto.com Pay API for merchant payment acceptance, refunds, subscriptions and invoicing
  with webhooks and idempotent refunds; the Crypto.com Developer Platform API for Cronos tokens, contracts,
  transactions, blocks, wallets, CronosID and DeFi; and an agent layer consisting of a published MCP server,
  an agent-first Rust CLI, and provider-authored Agent Skills for trading through the Crypto.com App and
  Exchange.'
