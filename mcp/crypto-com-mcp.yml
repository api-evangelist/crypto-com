  fetched: '2026-08-11'
  probe: JSON-RPC initialize + tools/list over stdio against npx -y @cryptocom/cdcx-cli@latest mcp
  result: '200-equivalent: initialize returned serverInfo {name: cdcx, version: 1.2.6}, tools/list returned
    9 tools with inputSchema'
  tools_observed: 9
