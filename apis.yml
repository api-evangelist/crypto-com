apis:
- name: Crypto.com Exchange REST API v1
  description: >-
    REST API for the Crypto.com Exchange covering public reference and market data
    (instruments, order book, candlesticks, trades, tickers, valuations, settlement prices,
    insurance fund, risk parameters) and authenticated trading, advanced order management
    (OCO/OTO/OTOCO), OTC RFQ, account balances and positions, crypto and fiat wallet
    operations, staking, trading bots and transaction history. Requests are JSON-RPC-shaped
    (id/method/params) over HTTPS; private methods are signed with an HMAC-SHA256 digital
    signature computed from the API key, method, id, sorted parameter string and nonce.
  humanURL: https://exchange-developer.crypto.com/exchange/v1/docs/api/rest-introduction
  baseURL: https://api.crypto.com/exchange/v1
