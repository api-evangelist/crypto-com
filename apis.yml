- name: Crypto.com Exchange WebSocket API v1
  description: >-
    WebSocket API for the Crypto.com Exchange, split into a Market Data stream (public
    channels for book, ticker, trade, candlestick, index, mark price, settlement, funding and
    open interest) and a User API stream (authenticated via public/auth once per session, then
    subscription channels for user.order, user.trade, user.balance, user.positions,
    user.account_risk, user.advance.order and related events). Same request envelope and error
    codes as REST; websocket termination codes 1000/1006/1013 are documented.
  humanURL: https://exchange-developer.crypto.com/exchange/v1/docs/api/websocket-introduction
  baseURL: wss://stream.crypto.com/exchange/v1
  tags:
  - crypto-exchange
  - market-data
  - trading
  - streaming
  properties:
  - type: Documentation
    url: https://exchange-developer.crypto.com/exchange/v1/docs/api/websocket-introduction
  - type: APIReference
    url: https://exchange-developer.crypto.com/exchange/v1/docs/api/websocket-common-api-reference
  - type: Webhooks
    url: asyncapi/crypto-com-event-surface.yml
  - type: ChangeLog
