tools:
- name: cdcx_market_risk-params
  description: Provides information on risk parameter settings for [Smart Cross Margin](https://crypto.com/exchange/document/margin-rules).
  required: []
  params: []
- name: cdcx_market_instruments
  description: Provides information on all supported instruments (e.g. BTCUSD-PERP).
  required: []
  params:
  - PREDICT_CONTRACT_TYPE
  - event_symbols
  - is_combo
- name: cdcx_market_book
  description: Fetches the public order book for a particular instrument and depth.
  required:
  - instrument_name
  params:
  - depth
  - instrument_name
- name: cdcx_market_candlestick
  description: Retrieves candlesticks (k-line data history) over a given period for an instrument (e.g.
    BTCUSD-PERP).
  required:
  - instrument_name
  params:
  - count
  - end_ts
  - instrument_name
  - start_ts
  - timeframe
- name: cdcx_market_trades
  description: Fetches the public trades for a particular instrument. Time window can only be up to 7
    days for maximum.
  required:
  - instrument_name
  params:
  - count
  - end_ts
  - instrument_name
  - start_ts
- name: cdcx_market_ticker
  description: Fetches the public tickers for all or a particular instrument.
  required: []
  params:
  - instrument_name
- name: cdcx_market_valuations
  description: Fetches valuation type data for an instrument.
  required:
  - instrument_name
  - valuation_type
  params:
  - count
  - end_ts
  - instrument_name
  - start_ts
  - valuation_type
- name: cdcx_market_settlement-prices
  description: Fetches settlement prices of expired instruments.
  required:
  - instrument_type
  params:
  - instrument_type
  - page
- name: cdcx_market_insurance
  description: Fetches the balance of the Insurance Fund for a particular currency.
  required:
  - instrument_name
  params:
  - count
  - end_ts
  - instrument_name
  - start_ts
