openapi: 3.2.0
info:
  title: Crypto.com Exchange API v1 Account Balance and Positions API
  version: 1.0.0
  description: '## Welcome


    Welcome to the Crypto.com Exchange API v1 reference documentation.'
servers:
- url: https://api.crypto.com/exchange/v1
  description: Production
- url: https://uat-api.3ona.co/exchange/v1
  description: UAT Sandbox
tags:
- name: Account Balance and Positions
  x-deploy-envs-by-business-units:
    fcm:
    - local
    - develop
    - staging
  description: Retrieve real-time and historical snapshots of wallet balances, open positions, margin requirements, and collateral status.
paths:
  /private/user-balance:
    post:
      tags:
      - Account Balance and Positions
      x-apply-to:
      - rest
      summary: private/user-balance
      description: Returns the user's wallet balance.
      operationId: privateUserBalance
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateUserBalance({});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_user_balance({})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateUserBalanceRequest'
            example:
              id: '11'
              method: private/user-balance
              api_key: YOUR_API_KEY
              sig: DIGITAL_SIGNATURE
              params: {}
              nonce: '1611022832613'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateUserBalanceResponse'
              example:
                id: '11'
                method: private/user-balance
                code: '0'
                result:
