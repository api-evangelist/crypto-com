        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_advanced_amend_order({\n    'order_id': '18342311',\n    'new_ref_price': '46000.0',\n    'new_quantity': '0.15',\n})\nprint(res)\n"
