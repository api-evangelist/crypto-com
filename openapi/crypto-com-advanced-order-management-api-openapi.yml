              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOtocoResponse'
              example:
                id: '1'
                method: private/advanced/create-otoco
                code: '40001'
                message: BAD_REQUEST
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
