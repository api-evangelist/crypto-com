openapi: 3.2.0
info:
  title: Crypto.com Exchange API v1 Advanced Order Management API
  version: 1.0.0
  description: '## Welcome


    Welcome to the Crypto.com Exchange API v1 reference documentation.'
servers:
- url: https://api.crypto.com/exchange/v1
  description: Production
- url: https://uat-api.3ona.co/exchange/v1
  description: UAT Sandbox
tags:
- name: Advanced Order Management
  description: Advanced Order Management provides trigger orders and multi-leg execution strategies beyond basic LIMIT and MARKET orders.
paths:
  /private/advanced/create-order:
    post:
      tags:
      - Advanced Order Management
      x-apply-to:
      - rest
      - ws-user-api
      summary: private/advanced/create-order
      description: 'Creates a new BUY or SELL trigger order on the Exchange.


        `type` must be STOP_LOSS, STOP_LIMIT, TAKE_PROFIT or TAKE_PROFIT_LIMIT.


        This call is asynchronous, so the response is simply a confirmation of the request.


        The `user.advanced.order` subscription can be used to check if the orders are successfully created.


        **Helpful information:**

        - STOP_LIMIT and TAKE_PROFIT_LIMIT will execute a LIMIT order when the ref_price is reached.

        - STOP_LOSS and TAKE_PROFIT will execute a MARKET order when the ref_price is reached.


        **To create trigger orders based on ref_price vs. the reference price (ref_price_type):**

        - ref_price below ref_price_type price: SELL STOP_LOSS and STOP_LIMIT, BUY TAKE_PROFIT and TAKE_PROFIT_LIMIT

        - ref_price above ref_price_type price: BUY STOP_LOSS and STOP_LIMIT, SELL TAKE_PROFIT and TAKE_PROFIT_LIMIT


        **SpotAttach / DerivAttach:**

        - **Contingency type resolution**: Automatically resolved from instrument type - spot instruments → SPOT_ATTACH, derivative instruments → DERIV_ATTACH

        - **DerivAttach attach-to-order**: Use `attach_order_id` to attach TP/SL to an existing limit order

        - **DerivAttach attach-to-position**: Use `attach_isolation_id` to attach TP/SL directly to an existing position (> 0 for isolated position ID, 0 for cross-margin position). Requires REDUCE_ONLY in exec_inst.

        - **Standalone TP/SL**: For derivatives, if neither `attach_order_id` nor `attach_isolation_id` is specified, isolation is resolved from `isolation_id` parameter (if provided) or defaults to cross-margin'
      operationId: privateAdvancedCreateOrder
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateAdvancedCreateOrder({\n  instrument_name: 'CRO_USD',\n  side: 'SELL',\n  type: 'STOP_LIMIT',\n  quantity: '10',\n  price: '0.12',\n  ref_price: '0.12',\n  client_oid: 'c5f682ed-7108-4f1c-b755-972fcdca0f02',\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_advanced_create_order({\n    'instrument_name': 'CRO_USD',\n    'side': 'SELL',\n    'type': 'STOP_LIMIT',\n    'quantity': '10',\n    'price': '0.12',\n    'ref_price': '0.12',\n    'client_oid': 'c5f682ed-7108-4f1c-b755-972fcdca0f02',\n})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateAdvancedCreateOrderRequest'
            example:
              method: private/advanced/create-order
              id: '6573'
              api_key: YOUR_API_KEY
              sig: DIGITAL_SIGNATURE
              nonce: '1750385416548'
              params:
                instrument_name: CRO_USD
                side: SELL
                type: STOP_LIMIT
                quantity: '10'
                price: '0.12'
                ref_price: '0.12'
                client_oid: c5f682ed-7108-4f1c-b755-972fcdca0f02
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOrderResponse'
              example:
                id: '6573'
                method: private/advanced/create-order
                code: '0'
                result:
                  client_oid: c5f682ed-7108-4f1c-b755-972fcdca0f02
                  order_id: '5755600460443882762'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOrderResponse'
              example:
                id: '1'
                method: private/advanced/create-order
                code: '40001'
                message: BAD_REQUEST
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOrderResponse'
              example:
                id: '1'
                method: private/advanced/create-order
                code: '40101'
                message: UNAUTHORIZED
        '408':
          description: Request timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOrderResponse'
              example:
                id: '1'
                method: private/advanced/create-order
                code: '40801'
                message: REQUEST_TIMEOUT
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOrderResponse'
              example:
                id: '1'
                method: private/advanced/create-order
                code: '42901'
                message: TOO_MANY_REQUESTS
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOrderResponse'
              example:
                id: '1'
                method: private/advanced/create-order
                code: '50001'
                message: INTERNAL_SERVER_ERROR
  /private/advanced/amend-order:
    post:
      tags:
      - Advanced Order Management
      x-apply-to:
      - rest
      - ws-user-api
      summary: private/advanced/amend-order
      description: 'Amends an existing trigger order on the Exchange.


        This call is asynchronous, so the response is simply a confirmation of the request.


        The `user.advanced.order` subscription can be used to check when the order is successfully amended.


        **Trigger Order Type Conversion:**

        - Set `new_price` to "0" → Convert trigger limit order to trigger market order

        - Set `new_price` to "> 0" → Convert trigger market order to trigger limit order'
      operationId: privateAdvancedAmendOrder
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateAdvancedAmendOrder({\n  order_id: '18342311',\n  new_ref_price: '46000.0',\n  new_quantity: '0.15',\n});\nconsole.log(res);\n"
      - lang: Python
