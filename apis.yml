  - type: RateLimits
    url: rate-limits/crypto-com-rate-limits.yml
- name: Crypto.com Exchange FIX API
  description: >-
    FIX 4.4-based API for institutional order entry, market data and drop copy on the
    Crypto.com Exchange, with tags borrowed from later FIX versions. Covers Logon/Logout,
    NewOrderSingle, MassOrder, OrderCancelRequest, OrderCancelReplaceRequest,
    OrderMassCancelRequest, ExecutionReport, SecurityList and MarketDataRequest. The FIX
    gateway is not reachable over the public internet - clients must establish an AWS
    PrivateLink connection - so no public baseURL is published.
  humanURL: https://exchange-developer.crypto.com/exchange/v1/docs/api/fix-introduction
  tags:
  - crypto-exchange
  - trading
  - fix-protocol
  - institutional
  properties:
  - type: Documentation
    url: https://exchange-developer.crypto.com/exchange/v1/docs/api/fix-introduction
  - type: APIReference
    url: https://exchange-developer.crypto.com/exchange/v1/docs/api/fix-fix-dictionary
  - type: ChangeLog
    url: https://exchange-developer.crypto.com/exchange/v1/docs/api/fix-change-log
  - type: RateLimits
    url: rate-limits/crypto-com-rate-limits.yml
- name: Crypto.com Pay API
  description: >-
    Merchant payments API for accepting cryptocurrency payments, issuing refunds, running
    subscriptions and recurring invoices, managing customers, products and sub-merchants, and
    reading transaction histories. REST over HTTPS with HTTP Basic authentication using a
    secret key, test and live modes separated by key prefix, an Idempotency-Key header on the
    refund API, and twelve signed webhook event types verified with an HMAC-SHA256
    Pay-Signature header.
  humanURL: https://pay-docs.crypto.com/
  baseURL: https://pay.crypto.com/api
  tags:
  - payments
  - merchant-payments
  - subscriptions
  - cryptocurrency
  properties:
  - type: Documentation
    url: https://pay-docs.crypto.com/
  - type: APIReference
    url: https://pay-docs.crypto.com/#api-reference
  - type: Authentication
    url: authentication/crypto-com-authentication.yml
  - type: Conventions
    url: conventions/crypto-com-conventions.yml
  - type: Idempotency
    url: conventions/crypto-com-conventions.yml
  - type: ErrorCatalog
    url: errors/crypto-com-error-codes.yml
  - type: Webhooks
    url: asyncapi/crypto-com-event-surface.yml
  - type: Sandbox
    url: sandbox/crypto-com-sandbox.yml
- name: Crypto.com Developer Platform API
  description: >-
    On-chain developer platform service API for Cronos EVM and Cronos zkEVM, exposing native
    and ERC-20 token balances and transfers, smart contract ABI and bytecode lookup,
    transaction and block queries, wallet creation and balances, CronosID name resolution,
    DeFi data, contract events, network information and an Exchange module. Access requires an
    API key created against a project in the Developer Platform dashboard; first-party
    TypeScript and Python client SDKs wrap the service.
  humanURL: https://developer.crypto.com/documentation
  baseURL: https://developer-platform-api.crypto.com/v1/cdc-developer-platform
