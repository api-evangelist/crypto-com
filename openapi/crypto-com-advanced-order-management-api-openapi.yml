  /private/advanced/cancel-oto:
    post:
      tags:
      - Advanced Order Management
      x-apply-to:
      - rest
      - ws-user-api
      summary: private/advanced/cancel-oto
      description: 'Cancel a SPOT_ATTACH or DERIV_ATTACH order on the Exchange. This call is asynchronous, so the response is simply a confirmation of the request. The `user.advanced.order` subscription can be used to check when each of the orders is successfully cancelled.


        **Note:** This API can also be used to cancel SpotAttach / DerivAttach orders regardless of the number of legs (2 or 3). Both `cancel-oto` and `cancel-otoco` can be used interchangeably to cancel SpotAttach / DerivAttach orders by `list_id`.'
      operationId: privateAdvancedCancelOto
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateAdvancedCancelOto({\n  list_id: '4421958062479290999',\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_advanced_cancel_oto({\n    'list_id': '4421958062479290999',\n})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateAdvancedCancelOtoRequest'
            example:
              method: private/advanced/cancel-oto
              id: '1234'
              api_key: YOUR_API_KEY
              sig: DIGITAL_SIGNATURE
              nonce: '123456789000'
              params:
                list_id: '4421958062479290999'
      responses:
        '200':
          description: Success.
          content:
            application/json:
