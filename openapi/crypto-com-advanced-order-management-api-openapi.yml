tags:
- name: Advanced Order Management
  description: 'Advanced Order Management provides trigger orders and multi-leg execution strategies beyond basic LIMIT and MARKET orders. Use these endpoints for conditional order execution based on price triggers.


    ## Trigger Orders


    Trigger orders activate when a reference price condition is met. Use [`private/advanced/create-order`](/docs/api/rest/private-advanced-create-order) to create trigger orders.


    | Type | Description |

    |------|-------------|

    | `STOP_LOSS` | Converts to a market order when trigger price is reached. Used to limit losses. |

    | `STOP_LIMIT` | Converts to a limit order when trigger price is reached. Offers price control on stop execution. |

    | `TAKE_PROFIT` | Market order activated when price moves favorably to the trigger level. Used to lock in gains. |

    | `TAKE_PROFIT_LIMIT` | Limit order activated when price moves favorably to the trigger level. |


    Trigger orders require:

    - `ref_price` — the trigger price

    - `ref_price_type` — reference price source: `MARK_PRICE` (default), `INDEX_PRICE`, or `LAST_PRICE`


    ## Multi-Leg Strategies


    Multi-leg orders link multiple orders together with conditional execution logic.


    | Strategy | Description | Endpoint |

    |----------|-------------|----------|

    | **OCO** (One-Cancels-Other) | Two orders where filling one cancels the other. Typically pairs a take-profit with a stop-loss. | [`private/advanced/create-oco`](/docs/api/rest/private-advanced-create-oco) |

    | **OTO** (One-Triggers-Other) | Primary order triggers a secondary order when filled. Used to attach TP/SL to an entry order. | [`private/advanced/create-oto`](/docs/api/rest/private-advanced-create-oto) |

    | **OTOCO** (One-Triggers-OCO) | Primary order triggers an OCO pair when filled. Entry order with both TP and SL attached. | [`private/advanced/create-otoco`](/docs/api/rest/private-advanced-create-otoco) |


    ## Contingency Types


    Multi-leg orders use contingency types to define the relationship between legs:


    | Type | Description |

    |------|-------------|

    | `OCO` | One-Cancels-Other: two orders, one cancels when the other fills |

    | `SPOT_ATTACH` | Attach trigger orders to a spot position |

    | `DERIV_ATTACH` | Attach trigger orders to a derivatives position (supports isolated margin) |


    ## Order Management


    - [`private/advanced/amend-order`](/docs/api/rest/private-advanced-amend-order) — modify trigger price or quantity

    - [`private/advanced/cancel-order`](/docs/api/rest/private-advanced-cancel-order) — cancel a single advanced order

    - [`private/advanced/cancel-all-orders`](/docs/api/rest/private-advanced-cancel-all-orders) — cancel all advanced orders for an instrument

    - [`private/advanced/get-open-orders`](/docs/api/rest/private-advanced-get-open-orders) — retrieve open advanced orders

    - [`private/advanced/get-order-history`](/docs/api/rest/private-advanced-get-order-history) — retrieve advanced order history


    ## Real-Time Updates


    Subscribe to `user.advanced.order` for real-time advanced order lifecycle events.

    '
paths:
  /private/advanced/create-order:
    post:
      tags:
      - Advanced Order Management
      x-apply-to:
      - rest
      - ws-user-api
      summary: private/advanced/create-order
      description: 'Creates a new BUY or SELL trigger order on the Exchange.


        `type` must be STOP_LOSS, STOP_LIMIT, TAKE_PROFIT or TAKE_PROFIT_LIMIT.


        This call is asynchronous, so the response is simply a confirmation of the request.


        The `user.advanced.order` subscription can be used to check if the orders are successfully created.


        **Helpful information:**

        - STOP_LIMIT and TAKE_PROFIT_LIMIT will execute a LIMIT order when the ref_price is reached.

        - STOP_LOSS and TAKE_PROFIT will execute a MARKET order when the ref_price is reached.


        **To create trigger orders based on ref_price vs. the reference price (ref_price_type):**

        - ref_price below ref_price_type price: SELL STOP_LOSS and STOP_LIMIT, BUY TAKE_PROFIT and TAKE_PROFIT_LIMIT

        - ref_price above ref_price_type price: BUY STOP_LOSS and STOP_LIMIT, SELL TAKE_PROFIT and TAKE_PROFIT_LIMIT


        **SpotAttach / DerivAttach:**

        - **Contingency type resolution**: Automatically resolved from instrument type - spot instruments → SPOT_ATTACH, derivative instruments → DERIV_ATTACH

        - **DerivAttach attach-to-order**: Use `attach_order_id` to attach TP/SL to an existing limit order

        - **DerivAttach attach-to-position**: Use `attach_isolation_id` to attach TP/SL directly to an existing position (> 0 for isolated position ID, 0 for cross-margin position). Requires REDUCE_ONLY in exec_inst.

        - **Standalone TP/SL**: For derivatives, if neither `attach_order_id` nor `attach_isolation_id` is specified, isolation is resolved from `isolation_id` parameter (if provided) or defaults to cross-margin

        '
      operationId: privateAdvancedCreateOrder
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateAdvancedCreateOrder({\n  instrument_name: 'CRO_USD',\n  side: 'SELL',\n  type: 'STOP_LIMIT',\n  quantity: '10',\n  price: '0.12',\n  ref_price: '0.12',\n  client_oid: 'c5f682ed-7108-4f1c-b755-972fcdca0f02',\n});\nconsole.log(res);\n"
