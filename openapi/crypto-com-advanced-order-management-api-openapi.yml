  /private/advanced/create-oco:
    post:
      tags:
      - Advanced Order Management
      x-apply-to:
      - rest
      - ws-user-api
      summary: private/advanced/create-oco
      description: 'Creates a One-cancels-the-Other (OCO) execution strategy on the Exchange.


        OCO execution strategy allows users to place a two-order strategy where one order automatically cancels the other when one of the orders is partially/fully executed. Users are able to place 2 orders - one LIMIT and one trigger order. Only one of the orders will be executed. The trigger order can either be a stop loss or take profit order. The OCO order type is only available for Spot trading pairs for now.


        This call is asynchronous, so the response is simply a confirmation of the request. The `user.advanced.order` subscription can be used to check if the orders are successfully created.


        For the content of each order in order_list, please refer to `private/create-order` for details. One order must be `LIMIT`, the other order must be `STOP_LOSS`, `STOP_LIMIT`, `TAKE_PROFIT_LIMIT` or `TAKE_PROFIT`. For `ref_price_type` of the trigger order, only `MARK_PRICE` is supported for now.'
      operationId: privateAdvancedCreateOco
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateAdvancedCreateOco({\n  order_list: [\n    { instrument_name: 'BTCUSD', quantity: '0.1', type: 'LIMIT', price: '93000', side: 'SELL' },\n    { instrument_name: 'BTCUSD', quantity: '0.1', type: 'STOP_LOSS', ref_price: '80000', side: 'SELL' },\n  ],\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_advanced_create_oco({\n    'order_list': [\n        {'instrument_name': 'BTCUSD', 'quantity': '0.1', 'type': 'LIMIT', 'price': '93000', 'side': 'SELL'},\n        {'instrument_name': 'BTCUSD', 'quantity': '0.1', 'type': 'STOP_LOSS', 'ref_price': '80000', 'side': 'SELL'},\n    ],\n})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateAdvancedCreateOcoRequest'
            example:
              method: private/advanced/create-oco
              id: '123456789'
              api_key: YOUR_API_KEY
              sig: DIGITAL_SIGNATURE
              nonce: '123456789000'
              params:
                order_list:
                - instrument_name: BTCUSD
                  quantity: '0.1'
                  type: LIMIT
                  price: '93000'
                  side: SELL
                - instrument_name: BTCUSD
                  quantity: '0.1'
                  type: STOP_LOSS
                  ref_price: '80000'
                  side: SELL
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOcoResponse'
              example:
                id: '1661331443'
                method: private/advanced/create-oco
                code: '0'
                result:
                  list_id: '6498090546073120100'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOcoResponse'
              example:
                id: '1'
                method: private/advanced/create-oco
                code: '40001'
                message: BAD_REQUEST
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOcoResponse'
              example:
                id: '1'
                method: private/advanced/create-oco
                code: '40101'
                message: UNAUTHORIZED
        '408':
          description: Request timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOcoResponse'
              example:
                id: '1'
                method: private/advanced/create-oco
                code: '40801'
                message: REQUEST_TIMEOUT
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOcoResponse'
              example:
                id: '1'
                method: private/advanced/create-oco
                code: '42901'
                message: TOO_MANY_REQUESTS
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedCreateOcoResponse'
              example:
                id: '1'
                method: private/advanced/create-oco
                code: '50001'
                message: INTERNAL_SERVER_ERROR
