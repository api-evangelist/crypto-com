openapi: 3.2.0
info:
  title: Crypto.com Exchange API v1 Trading API
  version: 1.0.0
  description: '## Welcome


    Welcome to the Crypto.com Exchange API v1 reference documentation.'
servers:
- url: https://api.crypto.com/exchange/v1
  description: Production
- url: https://uat-api.3ona.co/exchange/v1
  description: UAT Sandbox
tags:
- name: Trading
  x-deploy-envs-by-business-units:
    fcm:
    - local
    - develop
    - staging
  description: Private trading endpoints manage order placement and lifecycle.
paths:
  /private/create-order:
    x-discriminators:
      DMA:
        tags:
        - Trading
        summary: private/create-order
        description: "Creates a new BUY or SELL order. \n\nThis call is asynchronous, so the response is simply a confirmation of the request.\n\nThe `user.order` subscription can be used to check when the order is successfully created.\n"
    post:
      tags:
      - Trading
      x-apply-to:
      - rest
      - ws-user-api
      summary: private/create-order
      description: 'Creates a new BUY or SELL order.


        This call is asynchronous, so the response is simply a confirmation of the request.


        The `user.order` subscription can be used to check when the order is successfully created.'
      operationId: privateCreateOrder
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        x-discriminator-value: DMA
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateCreateOrder({\n  instrument_name: 'BTCUSD-PERP',\n  side: 'SELL',\n  type: 'LIMIT',\n  price: '50000.5',\n  quantity: '1',\n  client_oid: 'c5f682ed-7108-4f1c-b755-972fcdca0f02',\n  exec_inst: ['POST_ONLY'],\n  time_in_force: 'FILL_OR_KILL',\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        x-discriminator-value: DMA
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_create_order({\n    'instrument_name': 'BTCUSD-PERP',\n    'side': 'SELL',\n    'type': 'LIMIT',\n    'price': '50000.5',\n    'quantity': '1',\n    'client_oid': 'c5f682ed-7108-4f1c-b755-972fcdca0f02',\n    'exec_inst': ['POST_ONLY'],\n    'time_in_force': 'FILL_OR_KILL',\n})\nprint(res)\n"
      - lang: JavaScript
        label: JavaScript
        x-discriminator-value: Combo
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\n// Execute a previously quoted combo order\nconst res = await exchange.v1PrivatePostPrivateCreateOrder({\n  side: 'SELL',\n  type: 'PREVIOUSLY_QUOTED',\n  quote_id: '1234567890',\n  price: '50000.5',\n  quantity: '1',\n  time_in_force: 'IMMEDIATE_OR_CANCEL',\n  client_oid: 'c5f682ed-7108-4f1c-b755-972fcdca0f02',\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        x-discriminator-value: Combo
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\n# Execute a previously quoted combo order\nres = exchange.v1_private_post_private_create_order({\n    'side': 'SELL',\n    'type': 'PREVIOUSLY_QUOTED',\n    'quote_id': '1234567890',\n    'price': '50000.5',\n    'quantity': '1',\n    'time_in_force': 'IMMEDIATE_OR_CANCEL',\n    'client_oid': 'c5f682ed-7108-4f1c-b755-972fcdca0f02',\n})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateCreateOrderRequest'
            examples:
              DMA:
                x-discriminator-value: DMA
                value:
                  id: '1'
                  method: private/create-order
                  api_key: YOUR_API_KEY
                  sig: DIGITAL_SIGNATURE
                  nonce: '1610905028000'
                  params:
                    instrument_name: BTCUSD-PERP
                    side: SELL
                    type: LIMIT
                    price: '50000.5'
                    quantity: '1'
                    client_oid: c5f682ed-7108-4f1c-b755-972fcdca0f02
                    exec_inst:
                    - POST_ONLY
                    time_in_force: FILL_OR_KILL
              Combo:
                x-discriminator-value: Combo
                summary: Execute a previously quoted combo order
                value:
                  id: '1'
                  method: private/create-order
                  api_key: YOUR_API_KEY
                  sig: DIGITAL_SIGNATURE
                  nonce: '1610905028000'
                  params:
                    side: SELL
                    type: PREVIOUSLY_QUOTED
                    quote_id: '1234567890'
                    price: '50000.5'
                    quantity: '1'
                    time_in_force: IMMEDIATE_OR_CANCEL
                    client_oid: c5f682ed-7108-4f1c-b755-972fcdca0f02
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateOrderResponse'
              example:
                id: '1'
                method: private/create-order
                code: '0'
                result:
                  client_oid: c5f682ed-7108-4f1c-b755-972fcdca0f02
                  order_id: '18342311'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateOrderResponse'
              example:
                id: '1'
                method: private/create-order
                code: '40001'
                message: BAD_REQUEST
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateOrderResponse'
              example:
                id: '1'
                method: private/create-order
                code: '40101'
                message: UNAUTHORIZED
        '408':
          description: Request timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateOrderResponse'
              example:
                id: '1'
                method: private/create-order
                code: '40801'
                message: REQUEST_TIMEOUT
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateOrderResponse'
              example:
                id: '1'
                method: private/create-order
                code: '42901'
                message: TOO_MANY_REQUESTS
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCreateOrderResponse'
              example:
                id: '1'
                method: private/create-order
                code: '50001'
                message: INTERNAL_SERVER_ERROR
  /private/amend-order:
    post:
      tags:
      - Trading
      x-apply-to:
      - rest
      - ws-user-api
      summary: private/amend-order
      description: 'Amend an existing order on the Exchange.


        This call is asynchronous, so the response is simply a confirmation of the request.


        The user.order subscription can be used to check when the order is successfully created.


        Please note that amend order is designed as a convenience function such that it performs cancel and then create behind the scene. The new order will lose queue priority, except if the amend is only to amend down order quantity.'
      operationId: privateAmendOrder
      x-codeSamples:
      - lang: JavaScript
        label: JavaScript
        source: "const ccxt = require('ccxt');\nconst exchange = new ccxt.cryptocom({\n  apiKey: 'YOUR_API_KEY',\n  secret: 'YOUR_SECRET',\n  enableRateLimit: true,\n});\nconst res = await exchange.v1PrivatePostPrivateAmendOrder({\n  order_id: '6530219466236720401',\n  new_price: '82000',\n  new_quantity: '0.0002',\n});\nconsole.log(res);\n"
      - lang: Python
        label: Python
        source: "import ccxt\nexchange = ccxt.cryptocom({\n    'apiKey': 'YOUR_API_KEY',\n    'secret': 'YOUR_SECRET',\n    'enableRateLimit': True,\n})\nres = exchange.v1_private_post_private_amend_order({\n    'order_id': '6530219466236720401',\n    'new_price': '82000',\n    'new_quantity': '0.0002',\n})\nprint(res)\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateAmendOrderRequest'
            example:
              id: '53'
              method: private/amend-order
              api_key: YOUR_API_KEY
              sig: DIGITAL_SIGNATURE
              nonce: '1587846358253'
              params:
                order_id: '6530219466236720401'
                new_price: '82000'
                new_quantity: '0.0002'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAmendOrderResponse'
              example:
                id: '53'
                method: private/amend-order
                code: '0'
                result:
                  client_oid: '53'
                  order_id: '6530219466236720401'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAmendOrderResponse'
              example:
                id: '1'
                method: private/amend-order
                code: '40001'
                message: BAD_REQUEST
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAmendOrderResponse'
              example:
                id: '1'
                method: private/amend-order
                code: '40101'
                message: UNAUTHORIZED
        '408':
          description: Request timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAmendOrderResponse'
              example:
                id: '1'
                method: private/amend-order
                code: '40801'
                message: REQUEST_TIMEOUT
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAmendOrderResponse'
              example:
                id: '1'
