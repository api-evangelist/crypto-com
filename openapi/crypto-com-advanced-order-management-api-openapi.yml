            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedGetOrderListDetailResponse'
              example:
                id: '1'
                method: private/advanced/get-order-list-detail
                code: '42901'
                message: TOO_MANY_REQUESTS
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAdvancedGetOrderListDetailResponse'
              example:
                id: '1'
                method: private/advanced/get-order-list-detail
                code: '50001'
                message: INTERNAL_SERVER_ERROR
